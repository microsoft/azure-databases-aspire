name: Publish NuGet Package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  checks: read
  contents: write

# Never cancel a release midway; a second run for the same ref waits instead.
concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release evidence
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Release refused::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main."
            exit 1
          fi
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci-gate" \
            --jq '[.check_runs[] | select(.status == "completed" and .conclusion == "success")] | length')
          if [ "$passed" -eq 0 ]; then
            echo "::error title=Release refused::$GITHUB_SHA has no successful ci-gate check run. Re-run this workflow once Build and Test passes on it."
            exit 1
          fi

      - name: Extract release notes
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: python3 eng/scripts/extract-release-notes.py --changelog CHANGELOG.md --tag "$GITHUB_REF_NAME" --output release-notes.md

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore azure-databases-aspire.sln

      - name: Build
        run: dotnet build azure-databases-aspire.sln -c Release --no-restore

      - name: Test
        run: dotnet test azure-databases-aspire.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/Aspire.Hosting.DocumentDB/Aspire.Hosting.DocumentDB.csproj -c Release --no-build -o ./artifacts

      - name: Validate packed package
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python3 eng/scripts/validate-nuget-package.py --artifacts ./artifacts --tag "$RELEASE_TAG"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg

      - name: Push to NuGet
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
